[package]
name = "integration-hub-worker"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
e2e = []

[dependencies]
worker = { version = "0.9", features = ["d1", "queue"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
url = "2.5"

# Pure-Rust crypto (WASM-friendly, no C FFI)
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
subtle = "2.6"
getrandom = { version = "0.2", features = ["js"] }
zeroize = "1.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Crypto",
  "SubtleCrypto",
  "CryptoKey",
  "Pbkdf2Params",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
